<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 180" width="100%" height="180">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#818cf8"/>
    </linearGradient>
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="#1e293b" stroke-width="0.5" opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Container -->
  <rect width="848" height="178" x="1" y="1" rx="8" fill="url(#bgGrad)" stroke="#334155" stroke-width="1"/>
  
  <!-- Subtle Grid Overlay -->
  <rect width="846" height="176" x="2" y="2" rx="7" fill="url(#grid)"/>

  <!-- Terminal Status Pill -->
  <g transform="translate(40, 32)">
    <circle cx="6" cy="6" r="4" fill="#10b981"/>
    <circle cx="6" cy="6" r="7" fill="none" stroke="#10b981" stroke-width="0.75" opacity="0.5"/>
    <text x="22" y="10" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'JetBrains Mono', monospace" font-size="11" fill="#94a3b8" letter-spacing="1.5" font-weight="600">SYS_ID: 1MEshh // ACTIVE</text>
  </g>

  <!-- Top Right Metric Accent -->
  <g transform="translate(670, 32)">
    <text x="0" y="10" font-family="'JetBrains Mono', monospace" font-size="11" fill="#64748b" text-anchor="end" letter-spacing="0.5">ARCH · CACHYOS · RUST · PYTHON</text>
  </g>

  <!-- Main Identity -->
  <text x="40" y="94" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="32" font-weight="800" fill="#f8fafc" letter-spacing="-0.5">
    1MEshh <tspan fill="url(#cyanGrad)" font-size="28" font-weight="600">/ Systems &amp; Security</tspan>
  </text>

  <!-- Subtitle -->
  <text x="40" y="122" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="13.5" fill="#94a3b8">
    IT student specializing in Linux systems programming, SOC threat detection, and offensive security tooling.
  </text>

  <!-- Bottom Interactive Focus Chips -->
  <g transform="translate(40, 142)">
    <!-- Chip 1: Rust -->
    <rect x="0" y="0" width="60" height="20" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.75"/>
    <text x="30" y="14" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#e2e8f0" text-anchor="middle">RUST</text>

    <!-- Chip 2: Python -->
    <rect x="68" y="0" width="72" height="20" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.75"/>
    <text x="104" y="14" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#e2e8f0" text-anchor="middle">PYTHON</text>

    <!-- Chip 3: SOC Analysis -->
    <rect x="148" y="0" width="108" height="20" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.75"/>
    <text x="202" y="14" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#38bdf8" text-anchor="middle">SOC ANALYSIS</text>

    <!-- Chip 4: Penetration Testing -->
    <rect x="264" y="0" width="140" height="20" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.75"/>
    <text x="334" y="14" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#f43f5e" text-anchor="middle">PENETRATION TESTING</text>

    <!-- Chip 5: Linux Systems -->
    <rect x="412" y="0" width="112" height="20" rx="4" fill="#1e293b" stroke="#475569" stroke-width="0.75"/>
    <text x="468" y="14" font-family="'JetBrains Mono', monospace" font-size="10" font-weight="600" fill="#a855f7" text-anchor="middle">LINUX SYSTEMS</text>
  </g>
</svg>
